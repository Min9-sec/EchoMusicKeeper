name: Verify and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify source and runtime package
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
          cache-dependency-path: helper/go.mod

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Test and rebuild JavaScript
        run: |
          npm test
          npm run build
          npm run syntax
          npm run verify:package

      - name: Test and vet helper
        working-directory: helper
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...

      - name: Rebuild Windows helper
        working-directory: helper
        run: |
          version=$(node -p 'require("../package.json").version')
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -buildvcs=false -trimpath \
            -ldflags "-s -w -X main.version=${version}" \
            -o ../plugin/bin/echo-music-keeper-helper.exe \
            ./cmd/echo-music-keeper-helper

      - name: Verify committed runtime artifacts
        run: |
          npm run verify:package
          git diff --exit-code -- plugin/index.js plugin/bin/echo-music-keeper-helper.exe

  release:
    name: Publish tagged plugin package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify tag and package versions
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          package_version=$(node -p 'require("./package.json").version')
          manifest_version=$(node -p 'require("./plugin/manifest.json").version')
          tag_version=${TAG_NAME#v}
          test "$TAG_NAME" = "v${package_version}"
          test "$tag_version" = "$manifest_version"
          node scripts/verify-package.js

      - name: Verify tagged commit belongs to main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Assemble release assets
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          archive="EchoMusicKeeper-${TAG_NAME}-windows-x64.zip"
          (
            cd plugin
            zip -9 "../${archive}" LICENSE manifest.json index.js icon.svg bin/echo-music-keeper-helper.exe
          )
          archive_hash=$(sha256sum "$archive" | cut -d ' ' -f 1)
          helper_hash=$(sha256sum plugin/bin/echo-music-keeper-helper.exe | cut -d ' ' -f 1)
          printf '%s  %s\n' "$archive_hash" "$archive" > SHA256SUMS.txt
          printf '%s  %s\n' "$helper_hash" "bin/echo-music-keeper-helper.exe" >> SHA256SUMS.txt

      - name: Verify release archive layout
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          archive="EchoMusicKeeper-${TAG_NAME}-windows-x64.zip"
          expected=$(printf '%s\n' LICENSE manifest.json index.js icon.svg bin/echo-music-keeper-helper.exe | sort)
          actual=$(zipinfo -1 "$archive" | sort)
          test "$actual" = "$expected"
          head -n 1 SHA256SUMS.txt | sha256sum --check
          tail -n 1 SHA256SUMS.txt | (cd plugin && sha256sum --check)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          archive="EchoMusicKeeper-${TAG_NAME}-windows-x64.zip"
          gh release create "$TAG_NAME" "$archive" SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "EchoMusicKeeper ${TAG_NAME}"
